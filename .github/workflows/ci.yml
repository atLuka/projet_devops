name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - messaging-service
          - property-service
          - user-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build, test & coverage
        working-directory: ${{ matrix.service }}
        run: mvn -B clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload coverage report (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.service }}/target/site/jacoco/
          if-no-files-found: ignore

  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    needs: backend
    # Ne tourne pas pour les PR venant d'un fork (pas d'accès au secret SONAR_TOKEN)
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historique complet requis par Sonar (blame SCM + détection de "new code")
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Build reactor des 5 services (génère classes + JaCoCo) puis analyse Sonar
      # en une seule passe via le plugin Maven (détecte la couverture automatiquement).
      # Le plugin lit le token depuis la variable d'env SONAR_TOKEN.
      - name: Build, test, coverage & SonarQube Cloud
        run: mvn -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

  frontend:
    name: Frontend · ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - client-frontend
          - owner-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        # --ignore-scripts empêche l'exécution de scripts de cycle de vie des
        # dépendances lors de l'install (sécurité chaîne d'approvisionnement).
        run: npm ci --ignore-scripts

      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build

  docker-build:
    name: Docker build validation
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all service images
        run: docker compose build
