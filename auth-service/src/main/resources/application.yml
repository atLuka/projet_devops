server:
  port: 8443
  ssl:
    key-store: /app/certs/keystore.p12
    key-store-password: changeit
    key-store-type: PKCS12

spring:
  application:
    name: auth-service

jwt:
  secret: ${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgc2VjcmV0IGtleSBmb3IgSldUIHRva2VuIGdlbmVyYXRpb24gMTIzNDU2Nzg5MA==}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

user:
  service:
    url: ${USER_SERVICE_URL:https://localhost:8443}

logging:
  level:
    com.microservices: INFO
  pattern:
    console: "%d{HH:mm:ss} %-5level [auth-service] %logger{20} - %msg%n"
