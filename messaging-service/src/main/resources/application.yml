server:
  port: 8443
  ssl:
    key-store: /app/certs/keystore.p12
    key-store-password: changeit
    key-store-type: PKCS12

spring:
  application:
    name: messaging-service
  datasource:
    url: jdbc:postgresql://localhost:5432/messagingdb
    username: user
    password: password
  jpa:
    hibernate:
      ddl-auto: update

logging:
  level:
    com.microservices: INFO
  pattern:
    console: "%d{HH:mm:ss} %-5level [messaging-service] %logger{20} - %msg%n"
