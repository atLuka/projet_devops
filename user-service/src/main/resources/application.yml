server:
  port: 8443
  ssl:
    key-store: /app/certs/keystore.p12
    key-store-password: changeit
    key-store-type: PKCS12

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/userdb
    username: user
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    com.microservices: INFO
  pattern:
    console: "%d{HH:mm:ss} %-5level [user-service] %logger{20} - %msg%n"

# Mot de passe des comptes de démo (jeu de données seed). Surchargé par
# la variable d'environnement SEED_USER_PASSWORD en dehors du développement.
seed:
  user:
    password: ${SEED_USER_PASSWORD:password123}
