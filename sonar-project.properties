# --- Projet SonarQube Cloud ---
sonar.host.url=https://sonarcloud.io
sonar.organization=atluka
sonar.projectKey=atLuka_projet_devops
sonar.projectName=projet_devops

# --- Modules analysés (un sous-dossier Maven par service) ---
sonar.modules=api-gateway,auth-service,messaging-service,property-service,user-service

# --- Layout commun à chaque module (résolu relativement au dossier du module) ---
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports

# --- Dossier racine de chaque module ---
api-gateway.sonar.projectBaseDir=api-gateway
auth-service.sonar.projectBaseDir=auth-service
messaging-service.sonar.projectBaseDir=messaging-service
property-service.sonar.projectBaseDir=property-service
user-service.sonar.projectBaseDir=user-service
